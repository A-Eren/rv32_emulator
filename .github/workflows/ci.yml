name: build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both compilers, because -Werror is on: a warning only one of them
        # emits should still fail the build rather than sit there unnoticed.
        compiler: [g++, clang++]
        preset: [debug, asan]
    runs-on: ubuntu-latest
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev

      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # The self-checking assembly programs and the examples exercise the whole
      # pipeline -- assembler, encoder, decoder, executor, traps -- in one go,
      # so a green unit suite with broken end-to-end behaviour cannot slip past.
      - name: Run the example programs
        run: |
          set -e
          for f in examples/*.s; do
            echo "--- $f"
            ./build/${{ matrix.preset }}/rv32 run "$f" --quiet
          done

      - name: Check the .mem export
        run: |
          ./build/${{ matrix.preset }}/rv32 asm examples/fib.s -o /tmp/imem.mem --dmem /tmp/dmem.mem
          head -4 /tmp/imem.mem
          # Every line must be exactly eight lowercase hex digits.
          grep -qvE '^[0-9a-f]{8}$' /tmp/imem.mem && exit 1 || true

      # The GUI is created for real on Qt's offscreen platform, driven through
      # the actions the toolbar calls, then asked what it shows. No display
      # needed, so it runs here.
      - name: Render one GUI frame headlessly
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/${{ matrix.preset }}/rv32-gui examples/fib.s --screenshot /tmp/rv32.png --steps 6

  # -------------------------------------------------------------------------
  # The Windows build, and the download that comes out of it.
  #
  # MSYS2's UCRT64 environment rather than MSVC: the warning set in
  # cmake/CompilerWarnings.cmake is GCC's, so this is the same compiler the
  # Linux job runs and a warning cannot appear on one platform only because the
  # toolchain changed underneath it. UCRT (not msvcrt) is what makes `%zu` and
  # the rest of the C99 formats behave.
  # -------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    name: windows / mingw-ucrt64
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build/release

      # No release test preset, so name the directory instead. Same 23 tests
      # the Linux job runs, the GUI one included.
      - name: Test
        run: ctest --test-dir build/release --output-on-failure

      - name: Run the example programs
        run: |
          set -e
          for f in examples/*.s; do
            echo "--- $f"
            ./build/release/rv32.exe run "$f" --quiet
          done

      - name: Check the .mem export
        run: |
          set -e
          ./build/release/rv32.exe asm examples/fib.s -o imem.mem --dmem dmem.mem
          head -4 imem.mem
          grep -qvE '^[0-9a-f]{8}$' imem.mem && exit 1 || true

      # Everything a person needs in one directory: the two binaries, the Qt
      # DLLs and plugins they load at startup, and something to open.
      - name: Bundle
        run: |
          set -e
          mkdir -p dist
          cp build/release/rv32.exe build/release/rv32-gui.exe dist/
          strip dist/rv32.exe dist/rv32-gui.exe
          cp -r examples docs dist/
          cp README.md LICENSE dist/

          windeployqt=$(command -v windeployqt-qt6 || command -v windeployqt6 || command -v windeployqt)
          echo "using $windeployqt"
          "$windeployqt" --release --no-translations --compiler-runtime \
            "$(cygpath -w dist/rv32-gui.exe)"

          # windeployqt deploys the platform plugin it thinks the app needs, which
          # is qwindows.dll and nothing else. The headless check below asks for
          # the offscreen one, and a Qt that cannot load its platform plugin
          # does not exit with a message: this is a GUI-subsystem binary with no
          # console, so it opens a dialog and waits for a click that never
          # comes. Both plugins are tiny; ship them.
          for plugin in qoffscreen.dll qminimal.dll; do
            found=$(find /ucrt64 -name "$plugin" -path '*platforms*' | head -1)
            [ -n "$found" ] && cp "$found" dist/platforms/ && echo "bundled $plugin"
          done

          # windeployqt knows about Qt. Anything else still resolving into the
          # MSYS2 tree would be a DLL missing on a machine that has no MSYS2,
          # so copy those in too.
          for exe in dist/rv32.exe dist/rv32-gui.exe; do
            ldd "$exe" | awk '{print $3}' | grep -i '^/ucrt64/bin/' \
              | xargs -r -I{} cp -n {} dist/ || true
          done

          cat > dist/HOW-TO-RUN.txt <<'TXT'
          rv32 -- an RV32IM_Zicsr emulator, assembler and debugger.

          Double-click rv32-gui.exe for the desktop window: write assembly,
          press F5 to assemble, F8 to step. Open examples\fib.s to start.

          rv32.exe is the command-line half. From a terminal in this folder:

              rv32.exe run examples\fib.s
              rv32.exe dbg examples\fib.s
              rv32.exe asm examples\fib.s

          Keep the DLLs and the platforms\ folder next to rv32-gui.exe --
          it will not start without them. rv32.exe is self-contained and can
          be copied anywhere on its own.
          TXT

          du -sh dist

      # Run the bundle the way a person would: with nothing but Windows on
      # PATH. A DLL that was only ever found because MSYS2 was installed fails
      # here rather than on someone's machine.
      - name: Check the bundle runs on a clean PATH
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_QPA_PLATFORM = "offscreen"

          $cli = Start-Process dist\rv32.exe -ArgumentList '--version' `
            -NoNewWindow -Wait -PassThru
          if ($cli.ExitCode -ne 0) { throw "rv32.exe exited $($cli.ExitCode)" }

          # Not -Wait: a GUI-subsystem binary that fails at startup shows a
          # dialog instead of writing to a console, so the failure mode to
          # guard against is "never exits", and -Wait would spend the whole
          # step timeout on it before saying anything useful.
          $gui = Start-Process dist\rv32-gui.exe `
            -ArgumentList 'examples\fib.s','--screenshot','frame.png','--steps','6' `
            -PassThru
          if (-not $gui.WaitForExit(60000)) {
            $gui.Kill()
            throw "rv32-gui.exe did not exit within 60s -- it is most likely showing a dialog nobody can click"
          }
          if ($gui.ExitCode -ne 0) { throw "rv32-gui.exe exited $($gui.ExitCode)" }
          if (-not (Test-Path frame.png)) { throw "no frame was rendered" }

      - uses: actions/upload-artifact@v4
        with:
          name: rv32-windows-x64
          path: dist/
          if-no-files-found: error


  # -------------------------------------------------------------------------
  # The Linux download.
  #
  # ubuntu-22.04 on purpose: an AppImage carries its libraries but not glibc,
  # so it runs on distributions no older than the one that built it. Building
  # on the newest runner would quietly narrow that to almost nothing.
  # -------------------------------------------------------------------------
  appimage:
    runs-on: ubuntu-22.04
    name: linux / appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libfuse2 \
                                  libxcb-cursor0 libxkbcommon-x11-0

      - name: Build the AppImage
        run: ./packaging/build-appimage.sh

      # The same question the Windows bundle is asked: does it start somewhere
      # that has none of what built it? The platform plugin needed here is the
      # one linuxdeploy leaves out unless asked, so this is where that
      # omission surfaces -- loudly, unlike on Windows.
      - name: Check it runs headlessly
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          ./build/rv32-x86_64.AppImage --version
          ./build/rv32-x86_64.AppImage examples/fib.s --screenshot frame.png --steps 6
          test -s frame.png
          file frame.png | grep -q PNG

      - name: Check the installer puts it in the menu
        run: |
          set -e
          ./packaging/install.sh ./build/rv32-x86_64.AppImage
          desktop-file-validate "$HOME/.local/share/applications/rv32.desktop"
          test -f "$HOME/.local/share/icons/hicolor/256x256/apps/rv32.png"
          grep -q "^Exec=$HOME/.local/lib/rv32/AppRun" \
               "$HOME/.local/share/applications/rv32.desktop"
          ./packaging/install.sh --uninstall
          test ! -e "$HOME/.local/lib/rv32"

      - uses: actions/upload-artifact@v4
        with:
          name: rv32-linux-x86_64
          path: build/rv32-x86_64.AppImage
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # The download.
  #
  # An artifact expires and needs a GitHub login and a rummage through a run's
  # page to reach. A release is a stable URL with a zip on it. Cut one with:
  #
  #     git tag v0.1.0 && git push origin v0.1.0
  #
  # `needs: windows` is what makes this safe: the zip is the very directory
  # that just passed the clean-PATH check, so a release cannot be published
  # from a build that does not start.
  # -------------------------------------------------------------------------
  release:
    needs: [test, windows, appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rv32-windows-x64
          path: rv32-windows-x64

      - uses: actions/download-artifact@v4
        with:
          name: rv32-linux-x86_64
          path: .

      - name: Zip it
        run: |
          set -e
          chmod +x rv32-windows-x64/*.exe
          zip -qr rv32-windows-x64.zip rv32-windows-x64
          unzip -l rv32-windows-x64.zip | tail -3
          chmod +x rv32-x86_64.AppImage
          ls -lh rv32-x86_64.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rv32-windows-x64.zip
            rv32-x86_64.AppImage
          generate_release_notes: true
          body: |
            ## Linux

            Download **rv32-x86_64.AppImage** and run `install.sh` from the
            repository once -- rv32 then appears in the applications menu and
            `.s` files open with a double-click. The installer unpacks it under
            `~/.local`, needs no root, and undoes itself with `--uninstall`.

            The AppImage also runs on its own with `chmod +x` and a
            double-click, on any machine that still has `libfuse2`.

            ## Windows

            Download **rv32-windows-x64.zip**, unzip it anywhere, and
            double-click `rv32-gui.exe`. Nothing to install: the Qt DLLs and
            the plugins travel with it, and this exact directory is the one
            CI just ran with nothing but Windows on `PATH`.

            `rv32.exe` is the command-line half. It is linked statically, so it
            is a single file you can copy onto a lab machine on its own.

            Keep the DLLs and the `platforms\` folder next to `rv32-gui.exe` --
            it will not start without them.
